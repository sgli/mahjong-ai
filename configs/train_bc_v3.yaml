# Versioned representation-corrected BC baseline (Phase 10.3.7).
dataset_dir: "data/processed/decision-v3"
checkpoint_dir: "experiments/bc_v3/checkpoints"

dataset_version: "decision-v3"
dataset_transform: "decision-v3-contextual-to-action-v2-feature-v2"
feature_version: "feature-v2"
action_schema_version: "action-v2"
environment_version: "tenhou-v3-ron-context"
model_version: "bc-v3"
allow_kyuushu: false  # full rebuild recorded zero supervised kyuushu actions
data_audit_path: "experiments/phase10_3_9/full_audit.json"

model:
  hidden_sizes: [256, 256]

training:
  batch_size: 2048
  epochs: 5
  lr: 0.001
  seed: 42
  log_interval_steps: 1000
  device: "auto"
  use_amp: true
  pin_memory: true
  num_workers: 16
  prefetch_factor: 4
  data_worker_threads: 1
  shuffle_seed: 42
  limit_train_shards: 0

validation:
  mode: "sampled"
  samples: 5000000
